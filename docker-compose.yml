# The whole system, locally: the service, its dependencies and a client
# simulator.
#
#   make up                         the system
#   make up-deps                    only what the service needs
#   make simulate SCENARIO=...      exercise it as a provider would
#
# One thing here is worth understanding before changing it. Keycloak listens on
# 8081 *inside* the network and is published as 8081 outside, so `keycloak:8081`
# is the same URL from both sides. That is not tidiness: a token is accepted
# only when its `iss` matches what the service was configured to expect, and an
# issuer reachable at two different addresses has to pick one to put in the
# token. Publishing 8081:8080 would mean tokens minted from the host carry an
# issuer the service cannot reach, and every one of them would be refused.

services:
  postgres:
    image: postgres:17-alpine
    container_name: wagering-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-wagering}
      POSTGRES_USER: ${DB_USER:-wagering}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-only}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Without this the application starts before the database accepts
      # connections and fails at startup for a reason that is not its own.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wagering} -d ${DB_NAME:-wagering}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # A second, isolated database so integration tests neither compete with the
  # development environment nor wipe its data.
  postgres-test:
    image: postgres:17-alpine
    container_name: wagering-postgres-test
    environment:
      POSTGRES_DB: wagering_test
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data   # in memory: tests need not outlive the container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["test"]

  # The SQS emulator.
  #
  # The tag is pinned, and not out of pedantry: localstack/localstack:latest
  # became the licensed image, and a build that used it started failing with
  # "License activation failed" on a day nothing in this repository changed.
  # 3.8 is the last community line that runs unauthenticated.
  localstack:
    image: localstack/localstack:3.8
    container_name: wagering-localstack
    environment:
      SERVICES: sqs
      DEBUG: 0
      # The emulator ignores credentials but the SDK refuses to start without
      # them, so these exist to be present rather than to be secret.
      AWS_DEFAULT_REGION: ${QUEUE_REGION:-us-east-1}
    ports:
      - "${QUEUE_PORT:-4566}:4566"
    healthcheck:
      # Both states, and that is not belt and braces. LocalStack reports a
      # service as "available" until something uses it and "running"
      # afterwards -- so a check that accepted only the first turned the
      # container unhealthy the moment the application created its queues,
      # which is to say the moment it started working.
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -Eq '\"sqs\": \"(available|running)\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # A second emulator for the integration tests, so a test run cannot drain a
  # queue somebody is using by hand.
  localstack-test:
    image: localstack/localstack:3.8
    container_name: wagering-localstack-test
    environment:
      SERVICES: sqs
      DEBUG: 0
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4567:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -Eq '\"sqs\": \"(available|running)\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    profiles: ["test"]

  # The identity provider.
  #
  # Keycloak rather than an issuer written here, and it costs a heavy container
  # in `make up`. An issuer of our own would prove only that our code agrees
  # with our code: discovery, the key set and rotation would be our reading of
  # the specification on both sides of the conversation.
  #
  # It is deliberately absent from the automated tests, which sign with a key
  # generated on the spot and serve the key set in process. Nothing here is
  # needed to run `make check`.
  #
  # The realm is imported on every start and nothing is persisted: this is a
  # development issuer, and a clean one every time is worth more than any state
  # it could keep.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: wagering-keycloak
    # --http-port=8081 so the port is the same inside and outside, and
    # --hostname pins what goes into the `iss` claim. Left unpinned, Keycloak
    # derives the issuer from whichever address the token was requested
    # through, and the same realm would mint tokens the service refuses.
    command:
      - start-dev
      - --import-realm
      - --http-port=8081
      - --hostname=http://keycloak:8081
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-dev-only}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "${OIDC_PORT:-8081}:8081"
    healthcheck:
      # The management port, which is where Keycloak 25+ serves health. The
      # image ships neither curl nor wget, so this goes through bash's own
      # /dev/tcp redirection -- ugly, and it is what a distroless image leaves.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q UP <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # The service.
  api:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    container_name: wagering-api
    # Every address here is a name on this network. localhost inside a
    # container is the container, which is the single most common way a compose
    # file looks right and connects to nothing.
    environment:
      APP_ENV: local
      APP_HTTP_ADDR: ":8080"
      APP_METRICS_ADDR: ":9090"
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-wagering}
      DB_USER: ${DB_USER:-wagering}
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-only}
      DB_SSLMODE: disable

      QUEUE_ENDPOINT: http://localstack:4566
      QUEUE_REGION: ${QUEUE_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

      OIDC_ISSUER_URL: http://keycloak:8081/realms/wagering
      OIDC_AUDIENCE: wagering-core
    ports:
      # Only the business port. The metrics listener is deliberately not
      # published: it answers without a credential, and what reaches it should
      # be what this network already trusts. A scraper joins the network; it
      # does not come in from outside. See docs/adr/0012.
      - "${APP_PORT:-8080}:8080"
    depends_on:
      # By health, not by "started". The service runs its migrations at
      # start-up and reaches the identity provider while the graph is being
      # built -- against a database still initialising, it would fail the boot
      # and restart, which reads like a bug in the service.
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  # A client, for exercising the API the way a provider would.
  #
  # Behind a profile, so it never starts with `make up`. It runs inside the
  # network on purpose: it asks Keycloak for a token at the same address the
  # service validates against, which is the whole `iss` problem solved by
  # standing in the right place rather than by configuring around it.
  simulator:
    build:
      context: .
      dockerfile: deploy/simulator/Dockerfile
    container_name: wagering-simulator
    environment:
      API_URL: http://api:8080
      METRICS_URL: http://api:9090
      OIDC_URL: http://keycloak:8081/realms/wagering
      CLIENT_SECRET: local-dev-only
      QUEUE_ENDPOINT: http://localstack:4566
      QUEUE_NAME: ${QUEUE_NAME:-wager-transactions.fifo}
      # For the one scenario that plants a drift, which needs to write where
      # the domain cannot reach.
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-wagering}
      DB_USER: ${DB_USER:-wagering}
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-only}
    volumes:
      # Mounted rather than baked in: a scenario is meant to be edited and run
      # again, and a rebuild between the two would cost more than the script.
      - ./scripts/simulate:/scenarios:ro
    depends_on:
      api:
        condition: service_healthy
    profiles: ["sim"]

volumes:
  postgres-data:
