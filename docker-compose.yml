# Local environment: PostgreSQL, an SQS emulator and an identity provider.

services:
  postgres:
    image: postgres:17-alpine
    container_name: wagering-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-wagering}
      POSTGRES_USER: ${DB_USER:-wagering}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-only}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Without this the application starts before the database accepts
      # connections and fails at startup for a reason that is not its own.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wagering} -d ${DB_NAME:-wagering}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # A second, isolated database so integration tests neither compete with the
  # development environment nor wipe its data.
  postgres-test:
    image: postgres:17-alpine
    container_name: wagering-postgres-test
    environment:
      POSTGRES_DB: wagering_test
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data   # in memory: tests need not outlive the container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["test"]

  # The SQS emulator.
  #
  # The tag is pinned, and not out of pedantry: localstack/localstack:latest
  # became the licensed image, and a build that used it started failing with
  # "License activation failed" on a day nothing in this repository changed.
  # 3.8 is the last community line that runs unauthenticated.
  localstack:
    image: localstack/localstack:3.8
    container_name: wagering-localstack
    environment:
      SERVICES: sqs
      DEBUG: 0
      # The emulator ignores credentials but the SDK refuses to start without
      # them, so these exist to be present rather than to be secret.
      AWS_DEFAULT_REGION: ${QUEUE_REGION:-us-east-1}
    ports:
      - "${QUEUE_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"available\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # A second emulator for the integration tests, so a test run cannot drain a
  # queue somebody is using by hand.
  localstack-test:
    image: localstack/localstack:3.8
    container_name: wagering-localstack-test
    environment:
      SERVICES: sqs
      DEBUG: 0
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4567:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"available\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    profiles: ["test"]

  # The identity provider.
  #
  # Keycloak rather than an issuer written here, and it costs a heavy container
  # in `make up`. An issuer of our own would prove only that our code agrees
  # with our code: discovery, the key set and rotation would be our reading of
  # the specification on both sides of the conversation.
  #
  # It is deliberately absent from the automated tests, which sign with a key
  # generated on the spot and serve the key set in process. Nothing here is
  # needed to run `make check`.
  #
  # The realm is imported on every start and nothing is persisted: this is a
  # development issuer, and a clean one every time is worth more than any state
  # it could keep.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: wagering-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-dev-only}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "${OIDC_PORT:-8081}:8080"
    healthcheck:
      # The management port, which is where Keycloak 25+ serves health. The
      # image ships neither curl nor wget, so this goes through bash's own
      # /dev/tcp redirection -- ugly, and it is what a distroless image leaves.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q UP <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  postgres-data:
