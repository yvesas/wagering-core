# Local environment: PostgreSQL and an SQS emulator. The identity provider
# arrives in phase 9.

services:
  postgres:
    image: postgres:17-alpine
    container_name: wagering-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-wagering}
      POSTGRES_USER: ${DB_USER:-wagering}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-only}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Without this the application starts before the database accepts
      # connections and fails at startup for a reason that is not its own.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wagering} -d ${DB_NAME:-wagering}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # A second, isolated database so integration tests neither compete with the
  # development environment nor wipe its data.
  postgres-test:
    image: postgres:17-alpine
    container_name: wagering-postgres-test
    environment:
      POSTGRES_DB: wagering_test
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data   # in memory: tests need not outlive the container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["test"]

  # The SQS emulator.
  #
  # The tag is pinned, and not out of pedantry: localstack/localstack:latest
  # became the licensed image, and a build that used it started failing with
  # "License activation failed" on a day nothing in this repository changed.
  # 3.8 is the last community line that runs unauthenticated.
  localstack:
    image: localstack/localstack:3.8
    container_name: wagering-localstack
    environment:
      SERVICES: sqs
      DEBUG: 0
      # The emulator ignores credentials but the SDK refuses to start without
      # them, so these exist to be present rather than to be secret.
      AWS_DEFAULT_REGION: ${QUEUE_REGION:-us-east-1}
    ports:
      - "${QUEUE_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"available\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # A second emulator for the integration tests, so a test run cannot drain a
  # queue somebody is using by hand.
  localstack-test:
    image: localstack/localstack:3.8
    container_name: wagering-localstack-test
    environment:
      SERVICES: sqs
      DEBUG: 0
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4567:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"available\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    profiles: ["test"]

volumes:
  postgres-data:
